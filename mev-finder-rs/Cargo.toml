[package]
name = "mev-finder-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "2.5.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] } 
dotenv = "0.15" 
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
